[project]
name = "ai-ds-analyst"
version = "0.1.0"
description = "AI Data Science Analyst"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain>=1.3.16",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "streamlit>=1.62.0",
]

[project.scripts]
ai-ds-analyst = "ai_ds_analyst:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
